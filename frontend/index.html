  <!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vingo - Food Delivery</title>
    <style>
      /* ═══════════════════════════════════════════════════════════════════
          VINGO PREMIUM INITIAL LOADER
          Shows while React/JS loads - pure CSS animation
          Scoped to #initial-loader only - does NOT affect app layout
      ═══════════════════════════════════════════════════════════════════ */

      #initial-loader {
        position: fixed;
        inset: 0;
        z-index: 999999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0a0a0a;
        transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.6s;
      }

      #initial-loader.hide {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      #initial-loader * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      /* Animated background glow */
      #initial-loader .loader-bg {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }

      #initial-loader .loader-bg::before {
        content: '';
        position: absolute;
        width: 600px;
        height: 600px;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: radial-gradient(circle, rgba(226, 55, 68, 0.15) 0%, transparent 70%);
        animation: pulse-glow 2s ease-in-out infinite;
      }

      #initial-loader .loader-bg::after {
        content: '';
        position: absolute;
        width: 400px;
        height: 400px;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: radial-gradient(circle, rgba(226, 55, 68, 0.08) 0%, transparent 60%);
        animation: pulse-glow 2s ease-in-out infinite 0.5s;
      }

      @keyframes pulse-glow {
        0%, 100% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.5; }
        50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
      }

      /* Main logo container */
      #initial-loader .loader-logo {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
      }

      /* Animated icon ring */
      #initial-loader .loader-icon-wrapper {
        position: relative;
        width: 100px;
        height: 100px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* Outer rotating ring */
      #initial-loader .loader-ring-outer {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 2px solid transparent;
        border-top-color: #E23744;
        border-right-color: #E23744;
        animation: spin 1.2s linear infinite;
      }

      /* Middle pulsing ring */
      #initial-loader .loader-ring-middle {
        position: absolute;
        inset: 8px;
        border-radius: 50%;
        border: 1.5px solid rgba(226, 55, 68, 0.3);
        animation: pulse-ring 1.5s ease-in-out infinite;
      }

      /* Inner rotating ring (opposite) */
      #initial-loader .loader-ring-inner {
        position: absolute;
        inset: 16px;
        border-radius: 50%;
        border: 1.5px solid transparent;
        border-bottom-color: #E23744;
        border-left-color: #E23744;
        animation: spin 0.8s linear infinite reverse;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      @keyframes pulse-ring {
        0%, 100% { transform: scale(1); opacity: 0.3; }
        50% { transform: scale(1.05); opacity: 0.6; }
      }

      /* Center icon - animated V */
      #initial-loader .loader-v-icon {
        position: relative;
        z-index: 2;
        width: 52px;
        height: 52px;
        background: linear-gradient(135deg, #E23744, #ff6b5a);
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 30px rgba(226, 55, 68, 0.4), 0 0 60px rgba(226, 55, 68, 0.2);
        animation: icon-breathe 2s ease-in-out infinite;
      }

      #initial-loader .loader-v-icon span {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        font-size: 28px;
        font-weight: 900;
        color: white;
        line-height: 1;
        animation: v-appear 0.8s ease-out forwards;
      }

      @keyframes icon-breathe {
        0%, 100% { transform: scale(1); box-shadow: 0 0 30px rgba(226, 55, 68, 0.4), 0 0 60px rgba(226, 55, 68, 0.2); }
        50% { transform: scale(1.05); box-shadow: 0 0 40px rgba(226, 55, 68, 0.5), 0 0 80px rgba(226, 55, 68, 0.3); }
      }

      @keyframes v-appear {
        0% { opacity: 0; transform: scale(0.5) rotate(-10deg); }
        100% { opacity: 1; transform: scale(1) rotate(0deg); }
      }

      /* Brand text */
      #initial-loader .loader-brand {
        display: flex;
        align-items: baseline;
        gap: 2px;
        animation: brand-slide 0.8s ease-out 0.2s both;
      }

      #initial-loader .loader-brand-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        font-size: 42px;
        font-weight: 900;
        color: #ffffff;
        letter-spacing: -2px;
        line-height: 1;
      }

      #initial-loader .loader-brand-dot {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        font-size: 42px;
        font-weight: 900;
        color: #E23744;
        letter-spacing: -2px;
        line-height: 1;
        animation: dot-pulse 1.5s ease-in-out infinite;
      }

      @keyframes brand-slide {
        0% { opacity: 0; transform: translateY(15px); }
        100% { opacity: 1; transform: translateY(0); }
      }

      @keyframes dot-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
      }

      /* Tagline */
      #initial-loader .loader-tagline {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        font-size: 11px;
        font-weight: 700;
        color: rgba(255, 255, 255, 0.3);
        text-transform: uppercase;
        letter-spacing: 4px;
        animation: tagline-fade 1s ease-out 0.5s both;
      }

      @keyframes tagline-fade {
        0% { opacity: 0; letter-spacing: 8px; }
        100% { opacity: 1; letter-spacing: 4px; }
      }

      /* Progress bar */
      #initial-loader .loader-progress-wrapper {
        position: absolute;
        bottom: 80px;
        left: 50%;
        transform: translateX(-50%);
        width: 200px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        animation: progress-fade 1s ease-out 0.8s both;
      }

      #initial-loader .loader-progress-bar {
        width: 100%;
        height: 2px;
        background: rgba(255, 255, 255, 0.06);
        border-radius: 100px;
        overflow: hidden;
      }

      #initial-loader .loader-progress-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #E23744, #ff6b5a);
        border-radius: 100px;
        animation: progress-fill 2.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        box-shadow: 0 0 10px rgba(226, 55, 68, 0.5);
      }

      @keyframes progress-fill {
        0% { width: 0%; }
        20% { width: 25%; }
        50% { width: 60%; }
        80% { width: 85%; }
        100% { width: 100%; }
      }

      #initial-loader .loader-progress-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        font-size: 10px;
        font-weight: 700;
        color: rgba(255, 255, 255, 0.25);
        text-transform: uppercase;
        letter-spacing: 2px;
      }

      @keyframes progress-fade {
        0% { opacity: 0; }
        100% { opacity: 1; }
      }

      /* Floating particles */
      #initial-loader .loader-particles {
        position: absolute;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }

      #initial-loader .particle {
        position: absolute;
        width: 3px;
        height: 3px;
        background: rgba(226, 55, 68, 0.3);
        border-radius: 50%;
        animation: float-particle linear infinite;
      }

      #initial-loader .particle:nth-child(1) { left: 10%; animation-duration: 8s; animation-delay: 0s; }
      #initial-loader .particle:nth-child(2) { left: 20%; animation-duration: 12s; animation-delay: 1s; }
      #initial-loader .particle:nth-child(3) { left: 30%; animation-duration: 10s; animation-delay: 2s; }
      #initial-loader .particle:nth-child(4) { left: 50%; animation-duration: 9s; animation-delay: 0.5s; }
      #initial-loader .particle:nth-child(5) { left: 70%; animation-duration: 11s; animation-delay: 1.5s; }
      #initial-loader .particle:nth-child(6) { left: 80%; animation-duration: 7s; animation-delay: 2.5s; }
      #initial-loader .particle:nth-child(7) { left: 90%; animation-duration: 13s; animation-delay: 0.8s; }

      @keyframes float-particle {
        0% { transform: translateY(100vh) scale(0); opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { transform: translateY(-100px) scale(1); opacity: 0; }
      }

      /* Corner accents */
      #initial-loader .corner-accent {
        position: absolute;
        width: 60px;
        height: 60px;
        border: 1px solid rgba(226, 55, 68, 0.1);
        animation: corner-appear 1.5s ease-out 0.3s both;
      }

      #initial-loader .corner-accent.top-left { top: 40px; left: 40px; border-right: none; border-bottom: none; }
      #initial-loader .corner-accent.top-right { top: 40px; right: 40px; border-left: none; border-bottom: none; }
      #initial-loader .corner-accent.bottom-left { bottom: 40px; left: 40px; border-right: none; border-top: none; }
      #initial-loader .corner-accent.bottom-right { bottom: 40px; right: 40px; border-left: none; border-top: none; }

      @keyframes corner-appear {
        0% { opacity: 0; transform: scale(0.5); }
        100% { opacity: 1; transform: scale(1); }
      }
    </style>
  </head>
  <body>
    <!-- Premium Initial Loader -->
    <div id="initial-loader">
      <div class="loader-bg"></div>
      
      <div class="loader-particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
      </div>

      <div class="corner-accent top-left"></div>
      <div class="corner-accent top-right"></div>
      <div class="corner-accent bottom-left"></div>
      <div class="corner-accent bottom-right"></div>

      <div class="loader-logo">
        <div class="loader-icon-wrapper">
          <div class="loader-ring-outer"></div>
          <div class="loader-ring-middle"></div>
          <div class="loader-ring-inner"></div>
          <div class="loader-v-icon">
            <span>V</span>
          </div>
        </div>
        <div class="loader-brand">
          <span class="loader-brand-text">Vingo</span>
          <span class="loader-brand-dot">.</span>
        </div>
        <span class="loader-tagline">Premium Food Delivery</span>
      </div>

      <div class="loader-progress-wrapper">
        <div class="loader-progress-bar">
          <div class="loader-progress-fill"></div>
        </div>
        <span class="loader-progress-text">Loading experience</span>
      </div>
    </div>

    <div id="root"></div>
    <div id="portal"></div>

    <script>
      // Hide loader when React mounts
      window.addEventListener('load', function() {
        setTimeout(function() {
          var loader = document.getElementById('initial-loader');
          if (loader) {
            loader.classList.add('hide');
            setTimeout(function() {
              loader.remove();
            }, 600);
          }
        }, 2000); // Minimum 2s show time for premium feel
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  </body>
</html>
